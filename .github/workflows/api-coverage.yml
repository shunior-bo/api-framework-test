# API coverage (Day 2): runs the Playwright API suite against a fresh GAD and
# reports operation / status / parameter coverage with the tools/coverage CLI.
#
# Day 3 will add: base-vs-PR delta, HTML coverage report and the PR comment.
#
# GAD checkout: public repos work with the default GITHUB_TOKEN. If
# shunior-bo/gad-gui-api-demo is private, add a fine-grained PAT with read access
# to it as the repository secret GAD_REPO_TOKEN.
name: API coverage

on:
  pull_request:
  push:
    branches: [main, 'session/**']
  workflow_dispatch:
    inputs:
      gad_ref:
        description: 'GAD branch, tag or SHA (empty = default branch)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: api-coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  # GAD rejects "now" as a future date on hosts west of UTC (README: Known GAD
  # issues). Pinning UTC keeps CI deterministic; tc-articles-12 adapts to the offset.
  TZ: UTC
  GAD_REPOSITORY: shunior-bo/gad-gui-api-demo
  GAD_REF: ${{ inputs.gad_ref || '' }}
  GAD_PORT: '3000'
  FORCE_COLOR: '0'

jobs:
  api-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout framework
        uses: actions/checkout@v4

      - name: Checkout GAD
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GAD_REPOSITORY }}
          ref: ${{ env.GAD_REF }}
          path: gad
          token: ${{ secrets.GAD_REPO_TOKEN || github.token }}

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gad/package-lock.json

      - name: Install dependencies (framework + GAD, no browsers)
        run: |
          npm ci
          npm ci --prefix gad

      - name: Start GAD and wait for /api/health
        run: |
          # Background a SINGLE command with all three std streams redirected, so no
          # background shell keeps this step's stdout open (the step would hang).
          cd gad
          PORT="$GAD_PORT" nohup npm start > "$GITHUB_WORKSPACE/gad.log" 2>&1 < /dev/null &
          cd "$GITHUB_WORKSPACE"
          for i in $(seq 1 60); do
            if curl -sf "http://localhost:${GAD_PORT}/api/health" > /dev/null; then
              echo "GAD is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::GAD did not answer /api/health within 60s"
          tail -n 50 gad.log
          exit 1

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s#^BASE_URL=.*#BASE_URL=http://localhost:${GAD_PORT}#" .env

      - name: Run API tests
        id: tests
        continue-on-error: true
        run: npm run test:api

      - name: Coverage report
        if: always()
        run: npm run coverage -- --format console,json,gaps,markdown --top 10

      - name: Job summary
        if: always()
        run: |
          {
            echo "**API tests:** ${{ steps.tests.outcome }}"
            echo
            if [ -f reports/coverage/summary.md ]; then
              cat reports/coverage/summary.md
            else
              echo "_No coverage summary was produced — see the Coverage report step._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: reports/coverage/**
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            reports/html
            reports/results.xml
          if-no-files-found: warn

      - name: Upload GAD logs
        if: failure() || steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gad-logs
          path: gad.log
          if-no-files-found: warn

      - name: Fail if API tests failed
        if: steps.tests.outcome == 'failure'
        run: |
          echo "::error::API tests failed — see the playwright-report artifact."
          exit 1
